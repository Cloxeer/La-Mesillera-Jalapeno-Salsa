    hero.tag: Las Cruces, Nuevo México
    hero.headline: |-
      Salsa de jalapeño en lotes pequeños,
      hecha como sabe el hogar.
    hero.slogan: «Un Sabor de Casa»
    hero.subtext: Una sola receta, hecha en lotes pequeños y preparada fresca aquí
      en el Valle de Mesilla.
    hero.primaryCta.label: Ordenar por Teléfono
    hero.secondaryCta.label: Vende Nuestra Salsa
    badges.0: Lotes Pequeños
    badges.1: Ingredientes Reales
    badges.2: Hecha en Las Cruces, NM
    product.title: Una salsa. Hecha bien.
    product.description: "Hacemos una sola cosa y la hacemos bien: una salsa de
      jalapeño con un poco de picor y mucho sabor. Un picante en su punto, sin
      quemar."
    product.highlights.0: ¡Saborea el picante sin que te queme!
    product.highlights.1: Para los amantes de la salsa que la quieren justa y perfecta
    product.highlights.2: ¡Un poco de picor, mucho sabor!
    product.highlights.3: Un picante en su punto
    product.note: Embotellada profesionalmente y estable en anaquel, para que cada
      frasco sepa igual que el anterior.
    ingredients.title: Cuatro ingredientes. Nada más.
    ingredients.subtitle: Todo lo que hay en el frasco, nada que no puedas
      pronunciar. Mejor con un buen plato de totopos.
    ingredients.items.0.name: Tomate
    ingredients.items.0.description: La base roja y madura de cada frasco.
    ingredients.items.1.name: Jalapeño
    ingredients.items.1.description: El picor. Picante verde y fresco, en su punto.
    ingredients.items.2.name: Ajo
    ingredients.items.2.description: Calidez y profundidad en cada bocado.
    ingredients.items.3.name: Limón
    ingredients.items.3.description: Un toque cítrico para rematar.
    story.title: La receta detrás de La Mesillera
    story.paragraphs.0: La Mesillera nació en la cocina de Terry Evaro en Las
      Cruces, Nuevo México. Es una receta familiar hecha para los amantes de la
      salsa que la quieren justa y perfecta.
    story.paragraphs.1: Cada frasco lo prepara para nosotros The Fresh Chile Co., un
      productor de alimentos comercial aquí mismo en Las Cruces. La misma
      receta, los mismos ingredientes, hechos con estándares comerciales de
      seguridad alimentaria. Un sabor de casa, en cada frasco.
    whereToBuy.title: Dónde encontrarla
    whereToBuy.intro: Hoy somos una operación pequeña, y estamos creciendo. Así
      puedes conseguir un frasco ahora mismo.
    whereToBuy.options.0.title: Ordena directo
    whereToBuy.options.0.description: Llama o manda mensaje al 575-449-6063 y te
      ayudamos. Recogida local en Las Cruces, NM.
    whereToBuy.options.1.title: En tiendas locales
    whereToBuy.options.1.description: Estamos trabajando para llevar La Mesillera a
      tiendas y mercados por todo el Valle de Mesilla. Vuelve pronto.
    whereToBuy.note: ¿No nos ves en tu tienda favorita? Pídeles que vendan La
      Mesillera, o avísanos y nos comunicamos.
    stock.title: Vende La Mesillera en tu tienda
    stock.body: Un solo producto que vender — fácil de pedir, fácil de resurtir, y
      siempre la misma gran salsa. Nos encantaría ver La Mesillera en tu
      anaquel.
    stock.points.0: Estable en anaquel y lista para la venta
    stock.points.1: Producida en una instalación comercial en Las Cruces
    stock.points.2: Una sola salsa, fácil de pedir y resurtir
    stock.cta.label: Habla con Terry
    stock.note: O escribe a LaMesilleraJalapenoSalsa@gmail.com y te respondemos.
    contact.title: Salúdanos
    contact.body: Preguntas, pedidos, o solo para hablar de salsa. Nos encantaría
      saber de ti.
    footer.links.0.label: La Salsa
    footer.links.1.label: Ingredientes
    footer.links.2.label: Dónde Comprar
    footer.links.3.label: Para Tiendas
    privacy.title: Política de Privacidad
    privacy.updated: "Última actualización: julio de 2026"
    privacy.body.0: La Mesillera Jalapeño Salsa («nosotros») respeta tu privacidad.
      Esta política explica qué información recopilamos a través de este sitio
      web y cómo la usamos.
    privacy.body.1: No vendemos productos ni aceptamos pagos a través de este sitio,
      y no te pedimos crear una cuenta. Puedes navegar por todas las páginas sin
      darnos ninguna información personal.
    privacy.body.2: Si decides llamarnos, enviarnos un mensaje o un correo para
      hacer un pedido o una pregunta, recibimos los datos de contacto que
      compartes con nosotros, como tu nombre, número de teléfono o correo
      electrónico. Usamos esa información solo para responderte y para cumplir
      con los pedidos que nos solicitas.
    privacy.body.3: Para entender cómo se usa nuestro sitio, podemos usar analíticas
      respetuosas con la privacidad y sin cookies, que cuentan las visitas a las
      páginas y nos muestran cuáles son populares. Esto no te identifica
      personalmente ni instala cookies de publicidad o rastreo en tu
      dispositivo.
    privacy.body.4: No vendemos, alquilamos ni intercambiamos tu información
      personal. Solo podemos compartirla con proveedores de servicios de
      confianza que nos ayudan a operar el negocio, como la cocina comercial que
      embotella nuestra salsa, y solo en la medida necesaria para atenderte.
    privacy.body.5: Puedes contactarnos en cualquier momento para preguntar qué
      información tenemos sobre ti, corregirla o pedir que la eliminemos, y
      haremos todo lo posible por atender tu solicitud.
    privacy.body.6: Este sitio no está dirigido a niños, y no recopilamos
      información a sabiendas de menores de 13 años.
    privacy.body.7: Podemos actualizar esta Política de Privacidad de vez en cuando.
      Cuando lo hagamos, cambiaremos la fecha de «última actualización» que
      aparece arriba.
    privacy.body.8: ¿Preguntas sobre esta política? Llámanos o envíanos un mensaje
      al 575-449-6063, o escribe a LaMesilleraJalapenoSalsa@gmail.com.
    terms.title: Términos de Uso
    terms.updated: "Última actualización: julio de 2026"
    terms.body.0: Bienvenido al sitio web de La Mesillera Jalapeño Salsa. Al usar
      este sitio, aceptas estos Términos de Uso. Si no estás de acuerdo, por
      favor no uses el sitio.
    terms.body.1: Este sitio web se ofrece como información general sobre nuestra
      salsa y nuestro pequeño negocio. No es una oferta para vender productos en
      línea. Los pedidos se coordinan directamente con nosotros por teléfono,
      mensaje o correo.
    terms.body.2: Trabajamos para mantener la información de este sitio precisa y
      actualizada, pero no garantizamos que sea completa o esté libre de
      errores. Los detalles del producto, la disponibilidad y los precios pueden
      cambiar en cualquier momento sin previo aviso.
    terms.body.3: Todo el contenido de este sitio, incluidos nuestro nombre,
      logotipo, fotografías y texto, pertenece a La Mesillera Jalapeño Salsa y
      no puede copiarse ni reutilizarse sin nuestro permiso.
    terms.body.4: Este sitio y su contenido se ofrecen «tal cual», sin garantías de
      ningún tipo. En la máxima medida permitida por la ley, no somos
      responsables de ningún daño que surja del uso de este sitio.
    terms.body.5: Nuestro sitio puede enlazar a otros sitios web que no controlamos.
      No somos responsables del contenido ni de las prácticas de esos sitios.
    terms.body.6: Estos Términos de Uso se rigen por las leyes del Estado de Nuevo
      México, Estados Unidos.
    terms.body.7: Podemos actualizar estos Términos de Uso de vez en cuando. El uso
      continuo del sitio significa que aceptas la versión vigente.
    terms.body.8: ¿Preguntas? Llámanos o envíanos un mensaje al 575-449-6063, o
      escribe a LaMesilleraJalapenoSalsa@gmail.com.
