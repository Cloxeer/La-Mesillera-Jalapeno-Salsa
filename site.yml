product:
  title: One salsa. Done right.
  description: "We make one thing and we make it well: a jalapeño salsa with a
    little kick and a lot of flavor. Heat that hits just right, without the
    burn."
  image: /images/SalsaJarRBTBRB.png
  imageAlt: Jar of La Mesillera jalapeño salsa
  highlights:
    - Taste the Heat Without the Burn!
    - For Salsa Lovers Who Like It Just Perfect
    - A Little Kick, a Lot of Flavor!
    - Heat that hits just right
  note: Professionally bottled and shelf-stable, so every jar tastes the same as
    the last.
ingredients:
  title: Four ingredients. That's it.
  subtitle: Everything in the jar, nothing you can't pronounce. Best with a big
    bowl of chips.
  image: ""
  imageAlt: Tortilla chips with a bowl of La Mesillera jalapeño salsa
  items:
    - name: Tomato
      description: The ripe, red base of every jar.
      image: /images/TomatoRB.png
      imageAlt: Fresh ripe tomato
    - name: Jalapeño
      description: The kick. Fresh green heat that hits just right.
      image: /images/JalapenoRB.png
      imageAlt: Fresh green jalapeño pepper
    - name: Garlic
      description: Warmth and depth in every bite.
      image: /images/GarlicRB.png
      imageAlt: Bulb of fresh garlic
    - name: Lime
      description: A squeeze of bright to finish it off.
      image: /images/LimeRB.png
      imageAlt: Fresh lime cut in half
story:
  title: The recipe behind La Mesillera
  paragraphs:
    - La Mesillera started in Terry Evaro's kitchen in Las Cruces, New Mexico.
      It's a family recipe made for salsa lovers who like it just perfect.
    - Every jar is pressed for us by The Fresh Chile Co., a commercial food
      producer right here in Las Cruces. Same recipe, same ingredients, made to
      commercial food-safety standards. A taste of home, in every jar.
whereToBuy:
  title: Where to find it
  intro: We're a small operation today, and growing. Here's how to get a jar right
    now.
  options:
    - title: Order direct
      description: Call or text 575-449-6063 and we'll set you up. Local pickup in Las
        Cruces, NM.
    - title: Local shelves
      description: We're working on bringing La Mesillera to stores and markets around
        the Mesilla Valley. Check back soon.
  note: Don't see us at your favorite store? Ask them to carry La Mesillera, or
    let us know and we'll reach out.
stock:
  title: Carry La Mesillera in your store
  body: Just one product to carry — simple to order, easy to reorder, and always
    the same great salsa. We'd love to see La Mesillera on your shelf.
  points:
    - Shelf-stable and ready for retail
    - Produced in a commercial facility in Las Cruces
    - One salsa, simple to order and reorder
  cta:
    label: Talk to Terry
    href: tel:5754496063
  note: Or email LaMesilleraJalapenoSalsa@gmail.com and we'll get back to you.
contact:
  title: Say hello
  body: Questions, orders, or just salsa talk. We'd love to hear from you.
privacy:
  title: Privacy Policy
  updated: "Last updated: July 2026"
  body:
    - La Mesillera Jalapeño Salsa ("we", "us") respects your privacy. This
      policy explains what information we collect through this website and how
      we use it.
    - We do not sell products or take payments through this site, and we do not
      require you to create an account. You can browse every page without giving
      us any personal information.
    - If you choose to call, text, or email us to place an order or ask a
      question, we receive the contact details you share with us, such as your
      name, phone number, or email address. We use that information only to
      respond to you and to fulfill orders you ask us to.
    - To understand how our site is used, we may use privacy-friendly,
      cookieless analytics that count page visits and show us which pages are
      popular. This does not identify you personally and does not set
      advertising or tracking cookies on your device.
    - We do not sell, rent, or trade your personal information. We may share it
      only with trusted service providers who help us operate the business, such
      as the commercial kitchen that bottles our salsa, and only to the extent
      needed to serve you.
    - You can contact us at any time to ask what information we have about you,
      to correct it, or to ask us to delete it, and we will do our best to honor
      your request.
    - This site is not directed at children, and we do not knowingly collect
      information from anyone under 13.
    - We may update this Privacy Policy from time to time. When we do, we will
      change the "last updated" date shown above.
    - Questions about this policy? Call or text us at 575-449-6063, or email
      LaMesilleraJalapenoSalsa@gmail.com.
terms:
